# Uploads pr.sarif from the pull request's own tree to code scanning, the way a pull-request run
# hands a new-findings SARIF to upload-sarif.
name: upload
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  security-events: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pr.sarif
